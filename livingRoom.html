<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body class="control-room">
    <div class="header-lamp">
        <div class="sub-LivingRoom">Selamat Sore,User</div>

    </div>
    <h3 class="text-secondary3">Ruang Tamu</h3>

    <!-- Pintu -->
    <div class="cardD-main">
        <div class="icon-cardDevice">
            <div class="door-header">
                <svg width="100" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <rect x="30" y="30" width="60" height="60" rx="16" fill="#0f2e28" stroke="#2dd4a8"
                        stroke-width="2" />

                    <g fill="none" stroke="#2dd4a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Bingkai pintu -->
                        <rect x="48" y="42" width="24" height="36" rx="2" />
                        <!-- Gagang pintu -->
                        <circle cx="66" cy="60" r="1.8" fill="#2dd4a8" stroke="none" />
                    </g>
                </svg>
                <h3 class="title-door">Pintu Utama</h3>
            </div>

            <button class="btnDoor" id="btnDoor">🔓 Buka Pintu</button>

            <p id="textDanger"></p>

            <p class="access-status">
                Status Akses:
                <span id="accessText"></span>
            </p>
        </div>


        <!-- Lamp -->

        <div class="icon-cardDevice">
            <div class="card-iconLamp">
                <svg width="100" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Kotak dalam teal/hijau dengan border -->
                    <rect x="30" y="30" width="60" height="60" rx="16" fill="#0f2e28" stroke="#2dd4a8"
                        stroke-width="2" />

                    <!-- Ikon lampu  -->
                    <g fill="none" stroke="#2dd4a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Kepala bulb -->
                        <path d="M60 40 
             a14 14 0 0 1 14 14 
             c0 7 -4 10 -6 14 
             a4 4 0 0 1 -4 3 
             h-8 
             a4 4 0 0 1 -4 -3 
             c-2 -4 -6 -7 -6 -14 
             a14 14 0 0 1 14 -14 
             z" />
                        <!-- Filamen dalam bulb -->
                        <path d="M56 58 h8 M58 62 l2 4 l2 -4" stroke-width="1.8" />
                        <!-- Dasar/ulir bulb -->
                        <line x1="54" y1="74" x2="66" y2="74" />
                        <line x1="55" y1="78" x2="65" y2="78" />
                    </g>
                </svg>

                <h3>Lampu</h3>
            </div>

            <div class="lamp-control">
                <h6>LED 9W-Ruang Tamu</h6>
                <div class="energyLamp">
                    <svg width="60" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <rect x="30" y="30" width="60" height="60" rx="16" fill="#0f2e28" stroke="#2dd4a8"
                            stroke-width="2" />

                        <g fill="none" stroke="#2dd4a8" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <!-- Ikon petir/bolt -->
                            <path d="M64 38 L46 66 h10 l-4 16 20 -28 h-10 z" />
                        </g>
                    </svg>

                    <h3>0.35kWH Hari Ini</h3>
                </div>
            </div>

            <div class="lamp-controlToggle">
                <span id="lampStatus"></span>
                <label class="switch">
                    <input type="checkbox" id="lampToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="icon-cardDevice2">
        <!-- AC -->
        <div class="icon-cardDevice">
            <div class="ac-ttl">
                <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <rect x="30" y="30" width="60" height="60" rx="16" fill="#0f2e28" stroke="#2dd4a8"
                        stroke-width="2" />

                    <g fill="none" stroke="#2dd4a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Badan unit AC -->
                        <rect x="44" y="50" width="32" height="14" rx="4" />
                        <!-- Lubang angin -->
                        <line x1="48" y1="55" x2="72" y2="55" stroke-width="1.5" />
                        <line x1="48" y1="59" x2="72" y2="59" stroke-width="1.5" />
                        <!-- Hembusan angin -->
                        <path d="M50 68 q3 4 0 8" stroke-width="1.8" />
                        <path d="M60 68 q3 4 0 8" stroke-width="1.8" />
                        <path d="M70 68 q3 4 0 8" stroke-width="1.8" />
                    </g>
                </svg>
                <h3>AC</h3>
            </div>

            <div class="des-suhu">
                <div class="temp-section">
                    <p class="temp-label">Suhu :</p>
                    <div class="temp-row">
                        <input type="range" id="tempSlider" min="16" max="30" value="24">
                        <span id="tempValue">24°C</span>
                    </div>
                </div>
            </div>

            <div class="Ac-controlToggle">
                <span id="acStatus"></span>
                <label class="switch">
                    <input type="checkbox" id="acToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- TV -->
        <div class="icon-cardDevice">
            <div class="controlTV">
                <div class="TV-ttl">
                    <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <rect x="30" y="30" width="60" height="60" rx="16" fill="#0f2e28" stroke="#2dd4a8"
                            stroke-width="2" />

                        <g fill="none" stroke="#2dd4a8" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <!-- Layar TV -->
                            <rect x="42" y="44" width="36" height="24" rx="3" />
                            <!-- Kaki penyangga -->
                            <line x1="52" y1="68" x2="48" y2="76" />
                            <line x1="68" y1="68" x2="72" y2="76" />
                            <!-- Dudukan bawah -->
                            <line x1="48" y1="76" x2="72" y2="76" />
                        </g>
                    </svg>
                    <h3>TV</h3>
                </div>

                <div class="content-TV">
                    <h4 class="h4-p">Smart TV"-Ruang Tamu</h4>
                    <div class="source">
                        <svg width="40" height="40" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"
                            style="vertical-align:-2px; margin-right:-20px;">
                            <g fill="none" stroke="#2dd4a8" stroke-width="6" stroke-linecap="round"
                                stroke-linejoin="round" transform="rotate(-35 60 60)">
                                <!-- Badan kepala colokan -->
                                <rect x="42" y="42" width="36" height="36" rx="6" />
                                <!-- Dua pin -->
                                <line x1="54" y1="42" x2="54" y2="30" />
                                <line x1="66" y1="42" x2="66" y2="30" />
                            </g>
                        </svg>
                        <h4>Sumber:HDMI 1</h4>
                    </div>

                    <div class="fitur-TV">

                    <div class="volume">
                        <p class="temp-label">Volume</p>
                        <div class="temp-row">
                             <span id="tempValue">24°C</span>
                            <input type="range" id="tempSlider" min="0" max="100" value="50">
                        </div>
                    </div>

                    <div class="tv-channel">
                        <p class="tv-label">Channel</p>
                        <select id="channelSelect" class="channel-dropdown">
                            <option value="12-RCTI">12 - RCTI</option>
                            <option value="6-SCTV">6 - SCTV</option>
                            <option value="8-TransTV">8 - TransTV</option>
                            <option value="10-MetroTV">10 - MetroTV</option>
                        </select>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>


    <script src="door.js"></script>
    <script src="ac.js"></script>
    <script src="lamp.js"></script>
    <script src="TV.js"></script>
</body>

</html>
